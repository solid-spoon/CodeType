    <title>CodeType</title>
    <script>
      (function () {
        var U = "codetype_user",
          L = "codetype_last_page",
          SRC = "src/";
        var ALLOWED = ["trainer.html", "profile.html"];
        var user = null,
          last = null;
        try {
          user = localStorage.getItem(U);
          last = localStorage.getItem(L);
        } catch (e) {}
        if (!user) {
          location.replace(SRC + "login.html");
          return;
        }
        if (!last || ALLOWED.indexOf(last) < 0) last = "trainer.html";
        location.replace(SRC + last);
      })();
    </script>
